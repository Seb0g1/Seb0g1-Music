<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Музыка">
<meta name="theme-color" content="#0e0e10">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<title>Музыка</title>
<style>
  :root { --bg: #0e0e10; --card: #18181c; --text: #f4f4f6; --muted: #9a9aa5; --accent: #ffd43b; --line: #2a2a31; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: max(20px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom)); -webkit-user-select: none; user-select: none; }
  .wrap { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 22px; }
  .cover { width: 100%; aspect-ratio: 1; border-radius: 22px; background: var(--card) center/cover no-repeat; box-shadow: 0 18px 50px rgba(0,0,0,.45); display: grid; place-items: center; color: var(--muted); font-size: 64px; }
  .meta { min-height: 52px; }
  .title { font-size: 21px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artists { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .bar { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--text); border-radius: 4px; }
  .times { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .ctrl { display: flex; align-items: center; justify-content: space-between; padding: 0 6px; }
  button { appearance: none; border: 0; background: none; color: var(--text); padding: 0; cursor: pointer; touch-action: manipulation; }
  button:active { transform: scale(.92); }
  .side { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 50%; }
  .side svg { width: 34px; height: 34px; }
  .main { width: 84px; height: 84px; display: grid; place-items: center; border-radius: 50%; background: var(--text); color: var(--bg); }
  .main svg { width: 38px; height: 38px; }
  .vol { display: flex; align-items: center; gap: 12px; color: var(--muted); }
  .vol svg { width: 20px; height: 20px; flex: none; }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 32px; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(to right, var(--text) var(--p, 60%), var(--line) var(--p, 60%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--text); margin-top: -9px; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .status { text-align: center; color: var(--muted); font-size: 13px; min-height: 18px; }
  .pin { display: none; flex-direction: column; gap: 14px; text-align: center; }
  .pin input { font-size: 30px; letter-spacing: 10px; text-align: center; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); width: 100%; }
  .pin button { background: var(--accent); color: #111; font-weight: 700; font-size: 17px; padding: 14px; border-radius: 14px; }
  .err { color: #ff6b6b; min-height: 20px; font-size: 14px; }
  body.locked .player { display: none; } body.locked .pin { display: flex; }
</style>
</head>
<body class="locked">
<div class="wrap">
  <section class="pin" aria-label="Вход">
    <h2 style="margin:0">Управление музыкой</h2>
    <div style="color:var(--muted)">Введите PIN из файла remote.txt на ПК</div>
    <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="••••••">
    <button id="go">Войти</button>
    <div class="err" id="err"></div>
  </section>
  <section class="player wrap" aria-label="Плеер">
    <div class="cover" id="cover">♪</div>
    <div class="meta"><div class="title" id="title">—</div><div class="artists" id="artists"></div></div>
    <div><div class="bar"><i id="prog"></i></div><div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div></div>
    <div class="ctrl">
      <button class="side" id="prev" aria-label="Назад"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="main" id="pp" aria-label="Пауза"><svg id="ppi" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="side" id="next" aria-label="Вперёд"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
    <div class="vol">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9z"/></svg>
      <input type="range" id="vol" min="0" max="100" step="1" value="60" aria-label="Громкость">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9zm11.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM13 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
    </div>
    <div class="status" id="status"></div>
  </section>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
  let pin = ""; try { pin = localStorage.getItem("pin") || ""; } catch (e) {}
  let st = null, sig = "", at = 0, polling = false, ctl = null, dragging = false, volTimer = 0, lastCover = "";
  const mmss = (s) => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

  function lock(msg) { document.body.classList.add("locked"); $("err").textContent = msg || ""; stop(); }
  function unlock() { document.body.classList.remove("locked"); $("err").textContent = ""; }

  async function api(path, opts) {
    const r = await fetch(path, Object.assign({ headers: { "X-Pin": pin }, cache: "no-store" }, opts || {}));
    if (r.status === 401) { try { localStorage.removeItem("pin"); } catch (e) {} lock("Неверный PIN"); throw new Error("pin"); }
    if (r.status === 429) { lock("Слишком много попыток — подождите 10 минут"); throw new Error("locked"); }
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }

  function render() {
    if (!st) return;
    $("title").textContent = st.hasTrack ? st.title : "Ничего не играет";
    $("artists").textContent = st.hasTrack ? st.artists : "Включите музыку на ПК";
    if (st.cover !== lastCover) { lastCover = st.cover; $("cover").style.backgroundImage = st.cover ? 'url("' + st.cover + '")' : ""; $("cover").textContent = st.cover ? "" : "♪"; }
    $("ppi").innerHTML = st.playing ? PAUSE : PLAY;
    $("pp").setAttribute("aria-label", st.playing ? "Пауза" : "Играть");
    if (!dragging) { const v = Math.round(st.volume * 100); $("vol").value = v; $("vol").style.setProperty("--p", v + "%"); }
    $("status").textContent = st.loading ? "Загрузка…" : "";
    tick();
  }
  function tick() {
    if (!st) return;
    const pos = Math.min(st.duration || 0, st.position + (st.playing ? (Date.now() - at) / 1000 : 0));
    $("pos").textContent = mmss(pos); $("dur").textContent = mmss(st.duration);
    $("prog").style.width = st.duration ? (pos / st.duration * 100) + "%" : "0";
  }
  setInterval(() => { if (!document.hidden && st && st.playing) tick(); }, 1000);

  // Один долгий запрос: ПК отвечает, только когда меняется трек, пауза или громкость.
  async function loop() {
    if (polling) return; polling = true;
    while (polling && !document.hidden && pin) {
      try {
        ctl = new AbortController();
        const s = await api("/api/state?wait=" + (sig ? 1 : 0) + "&sig=" + encodeURIComponent(sig), { signal: ctl.signal });
        st = s; sig = s.sig; at = Date.now(); unlock(); render();
      } catch (e) {
        if (e.message === "pin" || e.message === "locked") break;
        if (e.name === "AbortError") break;
        $("status").textContent = "Нет связи с ПК — проверьте Wi-Fi";
        await new Promise((r) => setTimeout(r, 3000));
      }
    }
    polling = false;
  }
  function stop() { polling = false; if (ctl) ctl.abort(); }
  document.addEventListener("visibilitychange", () => { if (document.hidden) stop(); else { sig = ""; loop(); } });

  async function cmd(what, v) {
    try { await api("/api/cmd?do=" + what + (v !== undefined ? "&v=" + v : ""), { method: "POST" }); } catch (e) {}
  }
  $("pp").onclick = () => { if (st) { st.playing = !st.playing; at = Date.now(); render(); } cmd("playpause"); };
  $("next").onclick = () => cmd("next");
  $("prev").onclick = () => cmd("prev");
  const vol = $("vol");
  vol.addEventListener("input", () => {
    dragging = true; vol.style.setProperty("--p", vol.value + "%");
    if (!volTimer) volTimer = setTimeout(() => { volTimer = 0; cmd("volume", (vol.value / 100).toFixed(2)); }, 150);
  });
  vol.addEventListener("change", () => { clearTimeout(volTimer); volTimer = 0; cmd("volume", (vol.value / 100).toFixed(2)); setTimeout(() => { dragging = false; }, 400); });

  function login() { pin = $("pin").value.trim(); if (!pin) return; try { localStorage.setItem("pin", pin); } catch (e) {} sig = ""; loop(); }
  $("go").onclick = login;
  $("pin").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
  if (pin) loop(); else lock("");
})();
</script>
</body>
</html>
