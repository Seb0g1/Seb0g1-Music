<style>
  @font-face { font-family: Geologica; font-weight: 400 900; font-display: swap; src: url(/font-cyr.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: Geologica; font-weight: 400 900; font-display: swap; src: url(/font-lat.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; }
  /* Весь экран красится цветом обложки: --bg, --deep, --tint ставит скрипт (paint). */

    --nav: 62px; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px); --pad: 22px; --text: Geologica, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--deep); color: var(--ink); font: 400 16px/1.35 var(--text); overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; overflow: hidden; }

  /* фон и заливка при смене трека */

  .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: calc(var(--safe-t) + 18px) var(--pad) 28px; }

  /* плеер */

  .bar { display: flex; align-items: center; gap: 2px; margin: 0 -10px 0 0; }

  .plate .none { display: grid; place-items: center; color: var(--dim); }
  .plate .none svg { width: 34%; height: 34%; }

  @keyframes burst { 0% { transform: scale(.2) rotate(-16deg); opacity: 0; } 25% { transform: scale(1.15) rotate(4deg); opacity: 1; } 60% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.1) translateY(-30px); opacity: 0; } }
  .tip { position: absolute; left: 12px; right: 12px; bottom: 12px; background: rgba(0,0,0,.72); border-radius: 16px; padding: 12px 8px 12px 16px; font-size: 14px; display: flex; gap: 8px; align-items: center; z-index: 2; }

  .like svg { width: 30px; height: 30px; }

  h2 { margin: 0 0 14px; font-size: 30px; line-height: 1.1; font-weight: 750; letter-spacing: -.03em; overflow-wrap: anywhere; }

  .pic .none svg { width: 24px; height: 24px; }

  .row .t b { font-weight: 600; } .row .t span { color: var(--dim); font-size: 14px; margin-top: 1px; }
  .row.now .t b { color: var(--on); }

  .row .end .ico { width: 42px; height: 42px; } .row .end .ico svg { width: 23px; height: 23px; } .row .end .ok { color: var(--on); }
  .row:active .t b { opacity: .7; }
  .empty { color: var(--dim); padding: 18px 0; max-width: 34ch; } .empty button { margin-top: 14px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 48px; padding: 0 22px; border-radius: 24px; background: var(--tint); color: var(--deep); font-weight: 700; } .btn svg { width: 22px; height: 22px; }
  .btn.soft { background: var(--glass2); color: var(--ink); } .btn:active { transform: scale(.97); }
  .btns { display: flex; gap: 10px; margin: 0 0 14px; } .btns .btn { flex: 1; padding: 0 12px; }
  .find { position: sticky; top: calc(var(--safe-t) * -1 - 18px); z-index: 2; }
  .find input { width: 100%; height: 54px; border: 0; border-radius: 18px; background: var(--glass2); color: var(--ink); font: 500 17px var(--text); padding: 0 52px 0 18px; -webkit-user-select: text; user-select: text; -webkit-appearance: none; }
  .find input::placeholder { color: var(--dim); } .find input:focus { outline: 2px solid var(--on); } .find input::-webkit-search-cancel-button { display: none; }
  .find .ico { position: absolute; right: 4px; top: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; } .chips button { padding: 10px 16px; border-radius: 20px; background: var(--glass); font-size: 15px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wave { display: flex; align-items: center; gap: 18px; width: 100%; padding: 18px 20px; border-radius: 26px; background: var(--tint); color: var(--deep); }
  .wave svg { width: 54px; height: 54px; flex: none; } .wave b { display: block; font-size: 24px; font-weight: 780; letter-spacing: -.03em; line-height: 1.1; } .wave span { font-size: 14px; opacity: .8; }
  .wave:active { transform: scale(.985); }
  .vibes { display: flex; gap: 14px; overflow-x: auto; margin: 16px calc(var(--pad) * -1) 0; padding: 0 var(--pad) 4px; scrollbar-width: none; scroll-snap-type: x proximity; } .vibes::-webkit-scrollbar { display: none; }
  .vibes button { flex: none; width: 104px; scroll-snap-align: start; scroll-margin-left: var(--pad); } .vibes img, .vibes .none { width: 104px; height: 104px; border-radius: 22px; object-fit: cover; background: var(--glass); } .vibes .round { border-radius: 50%; }
  .vibes b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14px; font-weight: 600; line-height: 1.2; margin-top: 8px; }
  .back { display: flex; align-items: center; gap: 4px; margin: -8px 0 6px -10px; font-weight: 600; color: var(--dim); min-height: 44px; padding-right: 14px; } .back svg { width: 26px; height: 26px; }
  .sk { height: 52px; border-radius: 14px; background: var(--glass); margin: 7px 0; opacity: .7; }

  /* режим катки: жмём не глядя */
  .game { position: fixed; inset: 0; z-index: 20; background: #000; padding: calc(var(--safe-t) + 10px) 12px calc(var(--safe-b) + 12px); display: grid; grid-template-rows: auto auto 1fr 1.5fr; gap: 12px; }
  .game .bar { margin: 0 0 0 10px; } .game .bar div { flex: 1; min-width: 0; } .game .bar b, .game .bar span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .game .bar b { font-weight: 700; font-size: 18px; } .game .bar span { color: rgba(255,255,255,.66); font-size: 14px; }
  .game .pair { display: grid; grid-template-columns: 1fr 1.35fr; gap: 12px; min-height: 0; }
  .pad { border-radius: 34px; display: grid; place-items: center; align-content: center; gap: 8px; font-weight: 750; font-size: 22px; letter-spacing: -.02em; background: var(--bg); min-height: 0; width: 100%; transition: filter .12s; }
  .pad:active { filter: brightness(1.5); } .pad svg { width: 64px; height: 64px; } .pad.big { background: var(--tint); color: var(--deep); font-size: 34px; } .pad.big svg { width: 110px; height: 110px; }
  .game .slab { height: 74px; border-radius: 26px; overflow: hidden; background: rgba(255,255,255,.12); }
  .game .slab i, .game .slab.drag i { height: 100%; clip-path: none; background: none; } .game .slab i::after { background: var(--bg); }
  .game .slab em { position: relative; font-style: normal; font-weight: 700; font-size: 18px; padding-left: 22px; pointer-events: none; }

  /* шторка и сообщения */
  dialog { border: 0; padding: 0; color: var(--ink); background: none; width: 100%; max-width: 560px; margin: auto auto 0; max-height: 86dvh; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  .sheet { background: var(--deep); border-radius: 28px 28px 0 0; padding: 22px var(--pad) calc(var(--safe-b) + 20px); }
  .sheet h3 { margin: 0 0 10px; } .sheet .act { display: flex; align-items: center; gap: 16px; width: 100%; min-height: 54px; font-weight: 550; font-size: 17px; } .sheet .act svg { width: 25px; height: 25px; flex: none; color: var(--dim); } .sheet .act span { margin-left: auto; color: var(--dim); font-weight: 400; }
  .sheet .act.on { color: var(--on); } .sheet .act.on svg { color: var(--on); }
  .times { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; } .times button { min-height: 52px; border-radius: 16px; background: var(--glass2); text-align: center; font-weight: 650; } .times .wide { grid-column: 1 / -1; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--nav) + var(--safe-b) + 14px + var(--lift, 0px)); transform: translate(-50%, 20px); background: #111; color: #fff; padding: 13px 20px; border-radius: 18px; font-size: 15px; font-weight: 550; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 30; max-width: calc(100% - 40px); width: max-content; text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* вход */
  .login { position: fixed; inset: 0; z-index: 25; background: var(--deep); overflow-y: auto; padding: calc(var(--safe-t) + 9vh) 26px 40px; }
  .login > div { max-width: 400px; margin: 0 auto; } .login img { width: 76px; height: 76px; border-radius: 20px; margin-bottom: 26px; } .login h1 { font-size: 36px; margin-bottom: 12px; } .login p { color: var(--dim); margin: 0 0 26px; }
  .login input { width: 100%; height: 76px; border: 0; border-radius: 22px; background: var(--glass2); color: var(--ink); text-align: center; font: 700 36px var(--text); letter-spacing: .3em; padding-left: .3em; -webkit-user-select: text; user-select: text; } .login input:focus { outline: 2px solid var(--on); }
  .login .btn { width: 100%; min-height: 58px; border-radius: 29px; margin-top: 14px; font-size: 18px; } .err { color: #ffb0b0; min-height: 22px; margin-top: 14px; font-size: 15px; }
  body.checking .app, body.checking .login, body.locked .app { visibility: hidden; }
  body:not(.locked) .login { display: none; }

  /* компьютер и планшет: плеер и раздел рядом */
  @media (min-width: 900px) {
    .app { max-width: 1240px; grid-template-columns: minmax(360px, 460px) minmax(0, 1fr); grid-template-rows: minmax(0,1fr) auto; column-gap: 40px; padding: 0 28px; }
    .views { grid-column: 1 / -1; grid-row: 1; display: contents; }
    .view { position: relative; inset: auto; min-height: 0; }
    .player { display: flex !important; grid-column: 1; grid-row: 1 / 3; padding-bottom: 34px; padding-top: 26px; } .view:not(.player) { grid-column: 2; grid-row: 1; }
    .nav { grid-column: 2; grid-row: 2; max-width: 420px; width: 100%; grid-template-columns: repeat(3, 1fr); height: 76px; } .nav [data-v=player] { display: none; } .mini { display: none !important; } h1 { font-size: 34px; }
  }
  /* телефон боком */
  @media (max-width: 899px) and (max-height: 520px) and (orientation: landscape) {
    .app { max-width: none; padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left); --nav: 48px; } .nav { height: 48px; } .nav button { display: flex; gap: 8px; } .nav svg { width: 20px; height: 20px; }
    .player { display: grid; grid-template-columns: min(44vw, 100dvh - 70px) minmax(0,1fr); grid-template-rows: auto 1fr auto auto auto; column-gap: 26px; gap: 2px 26px; padding-bottom: 4px; } .player[hidden] { display: none !important; }
    .stage { grid-row: 1 / 6; grid-column: 1; min-height: 0; } .player > :not(.stage) { grid-column: 2; } .name { align-self: center; } h1 { font-size: 22px; -webkit-line-clamp: 1; } .keys .pp { width: 62px; height: 62px; } .keys .step { width: 52px; height: 52px; }
    .game { grid-template-rows: auto auto 1fr; } .game .big { grid-row: 3; grid-column: 1; width: auto; } .game .pair { grid-row: 3; grid-column: 1; width: 48%; } .game .big { margin-left: calc(48% + 12px); }
  }
  @media (hover: hover) { .ico:hover, .step:hover { background: var(--glass); } .row:hover .t b { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="ground"></div><div class="flood" id="flood"></div>

<main class="app">
  <div class="views">
    <section class="view player" id="v-player" aria-label="Плеер">

      if (!l.tracks.length) { box.replaceChildren(back, el("h2", "", l.title), empty("Здесь пока нет треков.")); return; }
      const bs = el("div", "btns"), play = el("button", "btn"), mix = el("button", "btn soft"); play.innerHTML = svg(P.play); play.append("Играть"); mix.innerHTML = svg(P.shuffle); mix.append("Вперемешку");
      const start = async (sh) => { buzz(12); await cmd("shuffle", "&v=" + (sh ? 1 : 0)); const id = sh ? l.tracks[Math.floor(Math.random() * l.tracks.length)].id : ""; if (await cmd("play", "&l=" + encodeURIComponent(k) + "&id=" + encodeURIComponent(id))) go("player"); };
      play.onclick = () => start(false); mix.onclick = () => start(true); bs.append(play, mix);
      box.replaceChildren(back, el("h2", "", l.title), bs, ...l.tracks.map((t) => row(t, { list: k, acts: true }))); markNow();
    } catch (e) { box.replaceChildren(back, el("h2", "", title), empty(why(e), "Повторить", () => openList(k, title))); }
  }
  addEventListener("popstate", () => { if (!$("game").hidden) { $("game").hidden = true; return; } if (lib) drawLib(); });

  // ---- разделы ----
  let view = "player";
  function go(v) {
    if (wide.matches && v === "player") v = view === "player" ? "queue" : view; view = v;
    for (const s of ["player", "queue", "search", "library"]) $("v-" + s).hidden = s !== v && !(wide.matches && s === "player");
    document.querySelectorAll(".nav button").forEach((b) => b.dataset.v === v ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
    $("mini").hidden = v === "player"; $("toast").style.setProperty("--lift", v === "player" || wide.matches ? "0px" : "72px"); if (v === "library" && !(history.state && history.state.list)) library(); if (v === "search") { showRecent(); if (!$("q").value && matchMedia("(hover: hover)").matches) $("q").focus(); }
  }
  document.querySelectorAll(".nav button").forEach((b) => { b.onclick = () => { if (b.dataset.v === "library" && view === "library" && history.state && history.state.list) history.back(); go(b.dataset.v); }; });
  $("miniT").onclick = () => go("player"); $("miniPic").onclick = () => go("player"); wide.addEventListener("change", () => go(view === "player" && wide.matches ? "queue" : view));

  // ---- режим катки ----
  $("bGame").onclick = () => { $("game").hidden = false; history.pushState({ game: 1 }, ""); buzz(16); };
  $("gX").onclick = () => history.back();

  // ---- шторка «Ещё» ----
  const dlg = $("dlg"); dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
  function act(d, label, fn, note, on) { const b = el("button", "act" + (on ? " on" : "")); b.innerHTML = svg(d); b.append(label); if (note) b.append(el("span", "", note)); b.onclick = fn; return b; }
  const sleepNote = () => st && st.sleep != null ? "ещё " + Math.max(1, Math.ceil((st.sleep - (Date.now() - at) / 1000) / 60)) + " мин" : "";
  $("bMore").onclick = () => {
    if (!st) return; const has = st.hasTrack, out = [];
    if (has) out.push(act(P.wave, "Волна по этому треку", async () => { dlg.close(); if (await cmd("wave", "&i=track")) toast("Волна: " + st.title); }), act(P.down, "Не нравится", async () => { dlg.close(); buzz(16); if (await cmd("dislike")) toast("Больше не попадётся"); }));
    out.push(act(P.moon, "Таймер сна", sleepSheet, sleepNote(), st.sleep != null), act(P.help, "Как управлять жестами", () => { dlg.close(); closeLyrics(); go("player"); showTip(); }));
    $("sheet").replaceChildren(...out); dlg.showModal();
  };
  function sleepSheet() {
    const grid = el("div", "times"); for (const m of [15, 30, 60, 90]) { const b = el("button", "", m + " мин"); b.onclick = async () => { dlg.close(); if (await cmd("sleep", "&v=" + m)) toast("Пауза через " + m + " мин"); }; grid.append(b); }
    if (st.sleep != null) { const b = el("button", "wide", "Выключить таймер"); b.onclick = async () => { dlg.close(); if (await cmd("sleep", "&v=0")) toast("Таймер выключен"); }; grid.append(b); }
    $("sheet").replaceChildren(el("h3", "", st.sleep != null ? "Музыка остановится: " + sleepNote() : "Через сколько остановить музыку"), grid);
  }

  // ---- клавиатура на компьютере ----
  addEventListener("pointerup", (e) => { if (e.pointerType === "mouse" && e.target.closest && e.target.closest("button")) setTimeout(() => document.activeElement && document.activeElement.matches("button:not(:focus-visible)") && document.activeElement.blur()); });
  addEventListener("keydown", (e) => {
    if (e.target.closest("input,[role=slider],dialog[open]") || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.code; if (k === "Space") { const b = e.target.closest("button"); if (b && b.matches(":focus-visible")) return; e.preventDefault(); playPause(); } else if (k === "ArrowRight") next(); else if (k === "ArrowLeft") prev(); else if (k === "ArrowUp" || k === "ArrowDown") { e.preventDefault(); sendVolume((st ? st.volume : .5) + (k === "ArrowUp" ? .05 : -.05), true); } else if (k === "KeyL") like(); else if (k === "Slash") { e.preventDefault(); go("search"); $("q").focus(); } else if (k === "Escape" && !$("game").hidden) history.back();
  });

  // ---- вход ----
  async function login() {
    const pin = $("pin").value.trim(); if (!pin) { $("err").textContent = "Введите PIN с экрана компьютера."; return; }
    $("go").disabled = true;
    try {
      const r = await api("/api/login", { method: "POST" }, pin);
      key = r.key; store.set("key", key);
      // Ключ в адресе: «На экран "Домой"» сохранит его вместе со страницей.
      history.replaceState(null, "", "/#k=" + key); unlock(); sig = ""; loop();
    } catch (e) { document.body.className = "locked"; if (e.message === "pin") $("err").textContent = "PIN не подошёл. Возможно, его сменили: откройте «Подключить телефон…» на компьютере."; else if (e.message !== "locked") $("err").textContent = "Нет связи с компьютером. Проверьте, что телефон в том же Wi-Fi."; }
    $("go").disabled = false;
  }
  $("go").onclick = login; $("pin").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
  go(wide.matches ? "queue" : "player");
  // QR-код со страницы подключения: адрес с #p=PIN — входим сами, PIN вводить не нужно.
  const pinFromHash = (location.hash.match(/p=(\d{4,8})/) || [])[1];
  if (pinFromHash && !key) { $("pin").value = pinFromHash; history.replaceState(null, "", "/"); login(); }
  else loop(); // проверка: если ключ или cookie есть, PIN не спросим
})();
</script>
